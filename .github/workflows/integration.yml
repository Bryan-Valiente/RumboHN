name: RUMBO integration

on:
  push:
    branches:
      - block/bryan-b01
      - block/owen-o01
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend tests and connected build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run test:run
      - name: Build for the existing Hostinger subdirectory
        run: npm run build -- --base=/demos/rumbo-hn/
        env:
          VITE_RUMBO_CLIENT_MODE: api

  backend:
    name: PHP syntax and synthetic tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install PHP 8.3 and SQLite driver
        run: |
          sudo apt-get update
          sudo apt-get install -y php8.3-cli php8.3-sqlite3 php8.3-mysql
      - name: Check PHP syntax
        run: find backend -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Require the SQLite test driver
        run: >-
          php -r "exit(in_array('sqlite', PDO::getAvailableDrivers(), true) ? 0 : 1);"
      - name: Run B01 synthetic tests
        run: php backend/tests/run.php
      - name: Run B01-L04 synthetic tests
        run: php backend/tests/l04.php
